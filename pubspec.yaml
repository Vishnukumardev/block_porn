name: block_porn
description: "A Mobile application to block pornographic content on Android devices, providing a safe browsing experience for users."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.10.0-162.1.beta
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  freezed: ^3.2.5
  get_it: ^6.0.0
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.4
  shared_preferences: ^2.5.4
  equatable: ^2.0.8
  intl: ^0.20.2
  logging: ^1.3.0
  json_annotation: ^4.9.0
  intl_utils: ^2.8.14
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  json_serializable: ^6.13.0
  freezed_annotation: ^3.1.0
  bloc_lint: ^0.4.1


flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/svg/
    - assets/sounds/

fonts:
    - family: Public Sans Bold
      fonts:
        - asset: assets/fonts/PublicSans-Bold.ttf
    - family: Public Sans Light
      fonts:
        - asset: assets/fonts/PublicSans-Light.ttf
    - family: Public Sans Medium
      fonts:
        - asset: assets/fonts/PublicSans-Medium.ttf
    - family: Public Sans Regular
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
    - family: Public Sans Thin
      fonts:
        - asset: assets/fonts/PublicSans-Thin.ttf
    - family: Public Sans Italic
      fonts:
        - asset: assets/fonts/PublicSans-Italic.ttf

flutter_intl:
  main_locale: en
  enabled: true
  class_name: S
  arb_dir: lib/l10n
  use_deferred_loading: false

    






















